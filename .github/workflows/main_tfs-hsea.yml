name: Build and deploy Node.js app to Azure Web App - TFS-HSEA

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Build
        run: npm run build

      - name: Preparar paquete standalone
        run: |
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static
          if [ -d public ]; then cp -r public .next/standalone/public; fi
          # La plantilla del JSA se lee en ejecución con process.cwd(): el rastreo del build no la incluye.
          if [ -d plantillas ]; then cp -r plantillas .next/standalone/plantillas; fi
          # Azure arranca con `npm start`; el package.json del paquete debe levantar server.js (no `next start`)
          # y escuchar en todas las interfaces: en el contenedor HOSTNAME es el id del contenedor y rompe el sondeo.
          node -e "const fs=require('fs');const f='.next/standalone/package.json';const p=fs.existsSync(f)?JSON.parse(fs.readFileSync(f,'utf8')):{name:'tfs-hsea',version:'0.0.0'};p.scripts={start:'HOSTNAME=0.0.0.0 node server.js'};fs.writeFileSync(f,JSON.stringify(p,null,2))"

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .next/standalone
          include-hidden-files: true
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Descargar artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'TFS-HSEA'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_0BF54EB5D8A540C89401C3D4CE941F49 }}